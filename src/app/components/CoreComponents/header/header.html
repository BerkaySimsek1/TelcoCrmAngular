<header class="bg-white shadow-sm h-16 flex items-center justify-between px-6 flex-shrink-0" id="app-header">
  <div class="flex items-center gap-4" id="app-header-left">
    <!-- Logo -->
    <div class="flex items-center gap-2" id="app-logo">
      <div class="w-6 h-6 bg-[#ff6b35] rounded" id="app-logo-mark"></div>
      <span class="text-2xl font-bold text-gray-800" id="app-logo-text">ETIYA</span>
    </div>

    <!-- Language -->
    <button
      id="lang-toggle-btn"
      class="px-3 py-1 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50"
      aria-label="Change language">
      EN
    </button>

    <!-- Page Title -->
    <div class="flex items-center gap-2 ml-4" id="page-title-wrap">
      <span class="text-sm text-gray-600" id="page-title-role">Sales Representative</span>
    </div>
  </div>

  <!-- User Info -->
  <div class="flex items-center gap-4" id="app-header-right">
    <div class="flex items-center gap-2" id="user-info">
      <span class="text-sm font-semibold text-[#ff6b35]" id="user-name">{{ currentUser() }}</span>
      <svg class="w-5 h-5 text-[#ff6b35]" fill="currentColor" viewBox="0 0 24 24" id="user-avatar-icon">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
      </svg>
    </div>

    <button 
      id="logout-btn"
      (click)="onLogout()"
      class="p-1 text-gray-600 hover:text-gray-800"
      aria-label="Log out">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="logout-icon">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>
</header>
