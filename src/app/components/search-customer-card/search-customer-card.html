<div class="w-full md:w-[320px] border-2 border-orange-300 rounded-xl p-4 bg-white/80">
  <div class="space-y-3">
    <!-- ACC-1: Sıralı alanlar -->
    <label class="block text-sm font-semibold text-gray-800">First Name</label>
    <input type="text" [formControl]="form.controls.firstName"
           class="w-full rounded-full border-2 border-orange-300 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-300">


    <label class="block text-sm font-semibold text-gray-800">Last Name</label>
    <input type="text" [formControl]="form.controls.lastName"
           class="w-full rounded-full border-2 border-orange-300 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-300">

    <label class="block text-sm font-semibold text-gray-800">Nat ID</label>
    <input type="text" [formControl]="form.controls.natId"
           class="w-full rounded-full border-2 border-orange-300 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-300 disabled:opacity-50">

    <label class="block text-sm font-semibold text-gray-800">Customer Number</label>
    <input type="text" [formControl]="form.controls.customerId"
           class="w-full rounded-full border-2 border-orange-300 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-300 disabled:opacity-50">

    <label class="block text-sm font-semibold text-gray-800">Account Number</label>
    <input type="text" [formControl]="form.controls.accountNumber"
           class="w-full rounded-full border-2 border-orange-300 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-300 disabled:opacity-50">

    <label class="block text-sm font-semibold text-gray-800">GSM Number</label>
    <input type="text" [formControl]="form.controls.gsmNumber"
           class="w-full rounded-full border-2 border-orange-300 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-300 disabled:opacity-50">

    
    

    <label class="block text-sm font-semibold text-gray-800">Order Number</label>
    <input type="text" [formControl]="form.controls.orderNumber"
           class="w-full rounded-full border-2 border-orange-300 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-300 disabled:opacity-50">

    <div class="flex items-center gap-3 pt-2">
      <!-- ACC-5 -->
      <button type="button"
              (click)="clear()"
              class="px-4 py-1.5 rounded-full border-2 border-orange-300 text-gray-700 hover:bg-orange-50">
        Clear
      </button>
      <!-- ACC-4 -->
      <button type="button"
              [disabled]="!canSearch()"
              (click)="submit()"
              class="px-4 py-1.5 rounded-full bg-orange-500 text-white disabled:opacity-40 hover:bg-orange-600">
        Search
      </button>
    </div>
  </div>
</div>
