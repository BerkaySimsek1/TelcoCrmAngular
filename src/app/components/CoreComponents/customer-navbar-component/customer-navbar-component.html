<div class="min-h-screen bg-gray-50 p-6" id="cust-layout-page">
  <div class="max-w-7xl mx-auto" id="cust-layout-wrap">
    <!-- Header -->
    <div class="mb-6" id="cust-header">
      <h1 class="text-3xl font-bold text-gray-800" id="cust-header-title">Customer Info</h1>
    </div>

    <!-- Navigation Bar -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-1.5 flex items-center gap-2 relative mb-6" id="cust-tabs">
      <!-- Customer Info Tab -->
      <button
        id="tab-info"
        (click)="navigateToTab('info')"
        [class]="getTabClasses('info')"
        class="transition-all duration-200 ease-out"
        aria-controls="cust-content">
        <span class="relative z-10" id="tab-info-label">Customer Info</span>
      </button>

      <!-- Customer Account Tab -->
      <button
        id="tab-account"
        (click)="navigateToTab('account')"
        [class]="getTabClasses('account')"
        class="transition-all duration-200 ease-out"
        aria-controls="cust-content">
        <span class="relative z-10" id="tab-account-label">Customer Account</span>
      </button>

      <!-- Address Tab -->
      <button
        id="tab-address"
        (click)="navigateToTab('address')"
        [class]="getTabClasses('address')"
        class="transition-all duration-200 ease-out"
        aria-controls="cust-content">
        <span class="relative z-10" id="tab-address-label">Address</span>
      </button>

      <!-- Contact Medium Tab -->
      <button
        id="tab-contact"
        (click)="navigateToTab('contact')"
        [class]="getTabClasses('contact')"
        class="transition-all duration-200 ease-out"
        aria-controls="cust-content">
        <span class="relative z-10" id="tab-contact-label">Contact Medium</span>
      </button>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2 ml-2" id="cust-actions">
        <!-- Edit Button - sadece info tab'da -->
        @if (activeTab === 'info') {
          <button
            id="cust-edit-btn"
            (click)="navigateToEdit()"
            class="p-2.5 hover:bg-gray-100 rounded-lg transition-colors duration-200 group"
            title="Edit Customer"
            aria-label="Edit Customer">
            <svg class="w-5 h-5 text-gray-600 group-hover:text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="cust-edit-icon">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
          </button>
        }

        <!-- Delete Button -->
        <button
          id="cust-delete-btn"
          class="p-2.5 hover:bg-red-50 rounded-lg transition-colors duration-200 group"
          title="Delete Customer"
          aria-label="Delete Customer">
          <svg class="w-5 h-5 text-gray-600 group-hover:text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="cust-delete-icon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>

        <!-- Close Button -->
        <button
          id="cust-close-btn"
          (click)="navigateToSearch()"
          class="p-2.5 hover:bg-gray-100 rounded-lg transition-colors duration-200 group"
          title="Close"
          aria-label="Close">
          <svg class="w-5 h-5 text-gray-600 group-hover:text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="cust-close-icon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Content Area -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6" id="cust-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
