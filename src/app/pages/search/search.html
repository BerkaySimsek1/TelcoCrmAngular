<div class="min-h-[calc(100vh-120px)] w-full bg-gradient-to-br from-orange-50 to-white p-4 md:p-6" id="sc-page">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-4 items-start" id="sc-layout">
    <div class="w-full md:w-80 flex-shrink-0">
      <app-search-customer-card
        id="sc-card"
        (searchClicked)="onSearch($event)"
        (cleared)="onCleared()">
      </app-search-customer-card>
    </div>

    <div class="w-full flex-1">
      <app-search-customer-list
        id="sc-list"
        [results]="results()"
        [loading]="loading()"
        [searched]="searched()"
        (createCustomer)="goCreate()">
      </app-search-customer-list>
    </div>
  </div>
</div>
