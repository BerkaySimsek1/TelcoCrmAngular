
    <div class="max-w-4xl mx-auto p-6">
      <!-- Tab Navigation -->
      <div class="flex gap-2 mb-6">
    
        <div class="ml-auto flex gap-2">
          <button
    class="p-2 hover:bg-gray-100 rounded transition-colors"
    title="Edit"
    [routerLink]="['/customer-update', (customerResponse()?.id ?? customerResponse()?.id)]">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
    </svg>
  </button>


          <button 
            
            class="p-2 hover:bg-gray-100 rounded transition-colors"
            title="Delete">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Customer Info Content -->
      
        @if (customerResponse(); as res) {
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
            <div class="grid grid-cols-2 gap-x-16 gap-y-6">
              <!-- Row 1 -->
              <div class="flex items-center">
                <label class="w-32 text-sm font-medium text-gray-700">First Name :</label>
                <span class="text-sm text-gray-900">{{ res.firstName || '-' }}</span>
              </div>
              <div class="flex items-center">
                <label class="w-36 text-sm font-medium text-gray-700">Middle Name :</label>
                <span class="text-sm text-gray-900">{{ res.middleName || '-' }}</span>
              </div>

              <!-- Row 2 -->
              <div class="flex items-center">
                <label class="w-32 text-sm font-medium text-gray-700">Last Name :</label>
                <span class="text-sm text-gray-900">{{ res.lastName || '-' }}</span>
              </div>
              <div class="flex items-center">
                <label class="w-36 text-sm font-medium text-gray-700">Birth Date :</label>
                <span class="text-sm text-gray-900">{{ res.dateOfBirth || '-' }}</span>
              </div>

              <!-- Row 3 -->
              <div class="flex items-center">
                <label class="w-32 text-sm font-medium text-gray-700">Mother Name :</label>
                <span class="text-sm text-gray-900">{{ res.motherName || '-' }}</span>
              </div>
              <div class="flex items-center">
                <label class="w-36 text-sm font-medium text-gray-700">Father Name :</label>
                <span class="text-sm text-gray-900">{{ res.fatherName || '-' }}</span>
              </div>

              <!-- Row 4 -->
              <div class="flex items-center">
                <label class="w-32 text-sm font-medium text-gray-700">Gender :</label>
                <span class="text-sm text-gray-900">{{ res.gender || '-' }}</span>
              </div>
              <div class="flex items-center">
                <label class="w-36 text-sm font-medium text-gray-700">Nat ID :</label>
                <span class="text-sm text-gray-900">{{ res.nationalId || '-' }}</span>
              </div>
            </div>
          </div>
        } @else {
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
            <p class="text-center text-gray-500">No customer data available</p>
          </div>
        }
      

    </div>
