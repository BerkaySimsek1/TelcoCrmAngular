<aside
  id="side-panel"
  [class]="isOpen() ? 'w-24' : 'w-0'"
  class="bg-[#3d4159] transition-all duration-300 overflow-hidden flex-shrink-0 h-screen">

  @if (isOpen()) {
    <nav class="flex flex-col h-full" id="side-nav" role="navigation" aria-label="Main Sidebar">
      <!-- B2C -->
      <a
        id="side-b2c"
        routerLink="/create-customer"
        routerLinkActive="bg-[#2a2d41]"
        class="flex flex-col items-center justify-center h-20 text-white hover:bg-[#2a2d41] transition-colors border-b border-gray-700"
        aria-label="Create B2C Customer">
        <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="side-b2c-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <span class="text-xs font-medium" id="side-b2c-text">B2C</span>
      </a>

      <!-- B2B -->
      <a
        id="side-b2b"
        href="#"
        class="flex flex-col items-center justify-center h-20 text-white hover:bg-[#2a2d41] transition-colors border-b border-gray-700"
        aria-label="B2B">
        <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="side-b2b-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        <span class="text-xs font-medium" id="side-b2b-text">B2B</span>
      </a>

      <!-- Menu Toggle -->
      <button
        id="side-menu-toggle"
        (click)="onToggle()"
        class="flex flex-col items-center justify-center h-20 text-white hover:bg-[#2a2d41] transition-colors border-b border-gray-700"
        aria-label="Toggle Sidebar">
        <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="side-menu-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <span class="text-xs font-medium" id="side-menu-text">Menu</span>
      </button>

      <!-- Thumbs Up -->
      <a
        id="side-like"
        href="#"
        class="flex flex-col items-center justify-center h-20 text-white hover:bg-[#2a2d41] transition-colors border-b border-gray-700"
        aria-label="Like">
        <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="side-like-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5" />
        </svg>
        <span class="text-xs font-medium" id="side-like-text">Like</span>
      </a>

      <!-- Document -->
      <a
        id="side-docs"
        href="#"
        class="flex flex-col items-center justify-center h-20 text-white hover:bg-[#2a2d41] transition-colors"
        aria-label="Documents">
        <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="side-docs-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span class="text-xs font-medium" id="side-docs-text">Docs</span>
      </a>
    </nav>
  }
</aside>
