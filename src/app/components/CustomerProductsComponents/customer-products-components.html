<div class="mt-2 p-3 bg-gray-50 rounded-md border">
  <h6 class="text-sm font-semibold text-gray-700 mb-2">Bu Hesaba Ait Ürünler:</h6>
  
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-100">
        <tr>
          <th scope="col" class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Product ID
          </th>
          <th scope="col" class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Product Name
          </th>
          <th scope="col" class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Campaign Name
          </th>
          <th scope="col" class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Campaign ID
          </th>
           <th scope="col" class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Status
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">

        @for (product of products(); track product.productOfferId) {
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-500">
              {{ product.productOfferId }}
            </td>
            <td class="px-4 py-2 whitespace-nowrap text-sm font-medium text-gray-900">
              {{ product.productOfferName }}
            </td>
            <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-500">
              </td>
            <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-500">
              </td>
            <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-500">
              {{ product.status }}
            </td>
          </tr>
        }

      </tbody>
    </table>

    @if (products().length === 0) {
      <div class="text-center py-4 text-sm text-gray-500 italic">
        Bu hesaba ait aktif ürün bulunamadı.
      </div>
    }

  </div>
