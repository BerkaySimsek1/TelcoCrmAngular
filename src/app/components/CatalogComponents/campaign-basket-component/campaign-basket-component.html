<!-- src/app/components/campaign-basket/campaign-basket.component.html -->
<div class="w-80 bg-white border border-gray-200 rounded-lg p-4" id="campaign-basket">
  <h2 class="text-lg font-semibold mb-4 pb-2 border-b border-gray-200">Basket</h2>

  <div class="space-y-3 mb-4">
    @for (it of items; track it.productOfferId) {
      <div class="py-3 border-b border-gray-200">
        <div class="flex justify-between">
          <div class="font-semibold">
            {{ it.campaignId }} • {{ it.productOfferName }} ({{ it.productOfferId }})
          </div>
          <div class="font-semibold">{{ it.price | number:'1.2-2' }} TL</div>
        </div>
        <button
          type="button"
          class="mt-2 text-sm px-2 py-1 rounded bg-gray-100 hover:bg-gray-200"
          (click)="onRemoveItem(it.productOfferId)"
        >
          Remove
        </button>
      </div>
    }

    @if (items.length === 0) {
      <div class="text-center py-8 text-gray-500">Your basket is empty</div>
    }
  </div>

  @if (items.length > 0) {
    <div class="border-t-2 border-gray-300 pt-4 mb-4">
      <div class="flex justify-between items-center">
        <span class="font-bold">Total Amount</span>
        <span class="font-bold">{{ totalAmount | number:'1.2-2' }} TL</span>
      </div>
    </div>

    <button
      type="button"
      class="w-full mb-3 px-4 py-2 border border-gray-300 rounded bg-white hover:bg-gray-50"
      (click)="onClear()"
    >
      Clear
    </button>
  }

  <button
    type="button"
    class="w-full px-4 py-2 border border-gray-300 rounded bg-white hover:bg-gray-50"
    [disabled]="items.length === 0"
    (click)="onNext()"
  >
    Next
  </button>
</div>
