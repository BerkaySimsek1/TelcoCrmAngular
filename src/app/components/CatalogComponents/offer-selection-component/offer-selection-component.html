<div class="flex gap-4 p-4" id="offer-selection-container">
  <!-- Left Panel: Offer Selection -->
  <div class="flex-1 bg-white border border-gray-200 rounded-lg p-4" id="offer-selection-panel">
    <!-- Tabs -->
    <div class="flex gap-2 mb-2">
      <button
        id="catalog-tab"
        type="button"
        (click)="onTabChange('catalog')"
        [class]="activeTab() === 'catalog' 
          ? 'px-4 py-1.5 border border-gray-200 border-b-0 rounded-t-lg bg-white font-semibold' 
          : 'px-4 py-1.5 border border-gray-200 border-b-0 rounded-t-lg bg-gray-50'"
      >
        Catalog
      </button>
      <button
        id="campaign-tab"
        type="button"
        (click)="onTabChange('campaign')"
        [class]="activeTab() === 'campaign' 
          ? 'px-4 py-1.5 border border-gray-200 border-b-0 rounded-t-lg bg-white font-semibold' 
          : 'px-4 py-1.5 border border-gray-200 border-b-0 rounded-t-lg bg-gray-50'"
      >
        Campaign
      </button>
    </div>

    <!-- Title -->
    <h2 class="text-orange-500 text-xl font-normal mb-3" id="offer-selection-title">
      Offer Selection
    </h2>

    <!-- Catalog Selection -->
    <div class="mb-4">
      <label class="block font-semibold mb-2 text-sm" for="catalog-dropdown">
        Catalog Selection
      </label>
      <select
        id="catalog-dropdown"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
        (change)="onCatalogChange($any($event.target).value)"
      >
        <option value="" selected disabled>Select</option>
        @for (c of catalogs(); track c.id) {
          <option [value]="c.id" [attr.data-test-id]="'catalog-option-' + c.id">
            {{ c.name }}
          </option>
        }
      </select>
    </div>

    <!-- Search Filters -->
    <div class="flex gap-3 items-end mb-4">
      <div class="flex-1">
        <label class="block font-semibold mb-2 text-sm" for="prod-offer-id-input">
          Prod Offer ID
        </label>
        <input
          id="prod-offer-id-input"
          type="text"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          (input)="filterId.set($any($event.target).value)"
          [value]="filterId()"
        />
      </div>

      <div class="flex-1">
        <label class="block font-semibold mb-2 text-sm" for="prod-offer-name-input">
          Prod Offer Name
        </label>
        <input
          id="prod-offer-name-input"
          type="text"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          (input)="filterName.set($any($event.target).value)"
          [value]="filterName()"
        />
      </div>

      <button
        id="search-button"
        type="button"
        class="px-4 py-2 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 font-medium"
        (click)="onSearchClick()"
      >
        Search
      </button>
    </div>

    <!-- Loading State -->
    @if (loading()) {
      <div class="text-center py-4" id="loading-indicator">Loading…</div>
    } @else {
      <!-- Offers Table -->
      <div class="border border-gray-200 rounded-lg overflow-hidden max-h-80 overflow-y-auto" id="offers-table-container">
        <table class="w-full border-collapse">
          <thead class="bg-gray-50 sticky top-0">
            <tr>
              <th class="px-4 py-2 text-left font-semibold text-sm border-b border-gray-200" id="table-header-id">
                Prod Offer ID
              </th>
              <th class="px-4 py-2 text-left font-semibold text-sm border-b border-gray-200" id="table-header-name">
                Prod Offer Name
              </th>
            </tr>
          </thead>
          <tbody>
            @for (o of filteredOffers(); track o.productOfferId; let i = $index) {
              <tr
                [attr.id]="'offer-row-' + o.productOfferId"
                [attr.data-test-id]="'offer-row-' + o.productOfferId"
                class="cursor-pointer transition-colors"
                [class.bg-blue-100]="isOfferSelected(o.productOfferId)"
                [class.border-l-4]="isOfferSelected(o.productOfferId)"
                [class.border-l-blue-500]="isOfferSelected(o.productOfferId)"
                [class.hover:bg-blue-50]="isOfferSelected(o.productOfferId)"
                [class.hover:bg-gray-100]="!isOfferSelected(o.productOfferId)"
                (click)="toggleOfferSelection(o)"
              >
                <td 
                  class="px-4 py-2 border-b border-gray-100 font-medium"
                  [class.bg-blue-50]="isOfferSelected(o.productOfferId)"
                  [class.text-blue-900]="isOfferSelected(o.productOfferId)"
                  [class.bg-gray-50]="i % 2 === 0 && !isOfferSelected(o.productOfferId)"
                  [attr.data-test-id]="'offer-id-' + o.productOfferId"
                >
                  {{ o.productOfferId }}
                </td>
                <td 
                  class="px-4 py-2 border-b border-gray-100"
                  [class.bg-blue-50]="isOfferSelected(o.productOfferId)"
                  [class.text-blue-900]="isOfferSelected(o.productOfferId)"
                  [class.font-medium]="isOfferSelected(o.productOfferId)"
                  [class.bg-gray-50]="i % 2 === 0 && !isOfferSelected(o.productOfferId)"
                  [attr.data-test-id]="'offer-name-' + o.productOfferId"
                >
                  {{ o.productOfferName }}
                </td>
              </tr>
            }
            @if (filteredOffers().length === 0) {
              <tr id="no-offers-row">
                <td colspan="2" class="px-4 py-8 text-center text-gray-500">
                  No offers found
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }

    <!-- Add to Basket Button -->
    <button
      id="add-to-basket-button"
      type="button"
      class="mt-4 px-6 py-2 bg-orange-500 text-white rounded-full hover:bg-orange-600 font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="selectedOffers().size === 0"
      (click)="addToBasket()"
    >
      Add to Basket
    </button>
  </div>

  <!-- Right Panel: Basket -->
  <app-basket-component
    [items]="basketItems()"
    (removeItem)="onRemoveFromBasket($event)"
    (clearBasket)="onClearBasket()"
    (next)="onNextClick()"
  ></app-basket-component>
</div>
