<!-- app.html -->
<div class="flex h-screen overflow-hidden">
  @if (isLoggedIn()) {
    <app-sidebar
      [isOpen]="sidebarOpen()"
      (toggle)="toggleSidebar()">
    </app-sidebar>
  }

  <div class="flex-1 flex flex-col min-w-0 bg-gray-50">
    @if (isLoggedIn()) {
      <app-header></app-header>
    }

    <main class="flex-1 overflow-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
